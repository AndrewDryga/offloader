# Keep the Hex, Go, npm and Terraform dependencies and the SHA-pinned GitHub Actions
# current, with one grouped PR per ecosystem a week to keep the noise low. The workflows
# pin each action to a commit SHA (supply-chain hardening: a moving @vN tag can be
# repointed, a digest can't). Dependabot bumps those SHAs and their `# vX.Y.Z` comments,
# so pinning to a digest doesn't mean silently going stale. Toolchain pins stay manual:
# .tool-versions, the OTP/Elixir versions in ci.yml, and the Dockerfile's base images.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: mix
    directory: "/server"
    schedule:
      interval: weekly
    groups:
      hex:
        patterns: ["*"]
        # duckdbex bundles the DuckDB engine, so its bumps get their own PR and review.
        exclude-patterns: ["duckdbex"]

  - package-ecosystem: gomod
    directory: "/tools"
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/dev/docs-site"
    schedule:
      interval: weekly
    groups:
      docs-site:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: "/infra"
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
